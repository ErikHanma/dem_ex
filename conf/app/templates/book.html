{% extends 'base.html' %}
{% block content %}
<div class='row justify-content-center'><div class='col-md-5'>
  <h4>Бронирование: {{ room.name }}</h4>
  <form method='post'>{% csrf_token %}
    <input name='date' type='date' class='form-control mb-2' required>
    <input name='time' type='time' class='form-control mb-2'>
    <select name='payment' class='form-select mb-2'>
      <option>Наличные</option>
      <option>Карта</option>
      <option>Безналичный</option>
    </select>
    <textarea name='comment' class='form-control mb-2' placeholder='Комментарий' rows='3'></textarea>
    <button class='btn btn-dark w-100'>Забронировать</button>
    <a href='{% url "rooms" %}' class='btn btn-outline-secondary w-100 mt-2'>Отмена</a>
  </form>
</div></div>
{% endblock %}
